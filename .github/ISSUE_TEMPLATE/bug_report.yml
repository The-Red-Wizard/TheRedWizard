name: Bug Report
description: Something is broken
title: "[Bug Report] "
body:
  - type: markdown
    attributes:
      value: |
        Please include a Kodi debug log.

        Turn on debug logging in **Kodi Settings → System → Logging → Enable debug logging**. Then make the problem happen one more time.

        Upload your log from **Red Light → Tools → Changelog & Log Utils → Upload Kodi Log to Pastebin**
        
        - or -
        
        **The Red Wizard → Tools → Upload Kodi Log** and paste the link below.
  - type: dropdown
    id: addon
    attributes:
      label: Add-on
      options:
        - Red Light
        - Gratis Red
        - MP3 Streams
        - The Red Wizard
        - Other, Please Specify
    validations:
      required: true
  - type: input
    id: addon-other
    attributes:
      label: Other add-on
      description: Only if you chose Other, Please Specify.
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Debug log link
      placeholder: https://paste.kodi.tv/
    validations:
      required: true
  - type: checkboxes
    id: log-confirmed
    attributes:
      label: Please confirm
      options:
        - label: A Kodi debug log has been included
          required: true
